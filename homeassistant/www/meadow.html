<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Family Meadow</title>
<style>
/* Family Meadow: the Verdant idea as a wall toy. A small ecosystem of cute creatures
   eats, breeds and gets eaten; the family live in it as named creatures, and tapping
   one opens that person's week. Built for the Crestron TSW-1060 (1280x800, WEBVIEW
   engine = Chrome 87), so: no backdrop-filter, no ctx.roundRect, no CSS
   aspect-ratio, no :is(). Served from HA's www/ as /local/meadow.html. */
@font-face { font-family: Fredoka; src: url(fonts/Fredoka.woff2) format("woff2");
  font-weight: 400 600; font-display: block; }
:root {
  --ink: #26352C; --ink-soft: #56675C; --paper: #F4F9F2; --paper-2: #E7F1E4;
  --scrim: rgba(22, 40, 30, .42); --warn: #A8431F; --hud: #26352C; --hud-soft: #4C6152;
}
body.night {
  --ink: #E6EEF2; --ink-soft: #A9B8C4; --paper: #1D2A3A; --paper-2: #26364A;
  --scrim: rgba(6, 10, 22, .55); --warn: #FFB08A; --hud: #EAF1F6; --hud-soft: #B3C2CF;
}
html, body { margin: 0; height: 100%; overflow: hidden; background: #A6D9A8;
  font-family: Fredoka, "Instrument Sans", Roboto, sans-serif; color: var(--ink);
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
canvas#world { display: block; position: fixed; left: 0; top: 0; touch-action: none; }

#hud { position: fixed; left: 40px; top: 22px; pointer-events: none; color: var(--hud); }
#clock { font-size: 88px; font-weight: 600; line-height: 1; letter-spacing: -.02em; }
#date { font-size: 26px; font-weight: 500; margin-top: 4px; }
#next { font-size: 22px; margin-top: 8px; color: var(--hud-soft); }
#clock .temp { font-size: 34px; font-weight: 500; margin-left: 16px; vertical-align: 40px; color: var(--hud-soft); }
#next b { font-weight: 600; color: var(--hud); }
#corner { position: fixed; right: 36px; top: 30px; text-align: right; pointer-events: none;
  font-size: 19px; color: var(--hud-soft); }
#status { color: var(--warn); font-weight: 500; margin-top: 6px; }

/* Countdowns: a row of tags in the sky between the clock and the corner hint, the
   same white pill with a coloured rim and a number badge as the name tags on the
   canvas, so "Mia 31" reads the same way "Jo 3" does. Fixed colours, not the
   HUD variables: the pills stay white at night like the tags do. */
#dates { position: fixed; left: 390px; right: 340px; top: 32px; height: 40px; display: flex;
  align-items: flex-start; overflow: hidden; pointer-events: none; }
.dchip { flex: none; display: flex; align-items: center; height: 36px; margin-right: 12px;
  padding: 0 5px 0 10px; border-radius: 999px; box-sizing: border-box;
  background: rgba(255, 255, 255, .95); border: 2.5px solid #999;
  font: 600 18px Fredoka, sans-serif; color: #26352C; white-space: nowrap; }
.dchip:last-child { margin-right: 0; }
.dchip .dic { width: 22px; height: 22px; margin-right: 7px; flex: none; }
.dchip .dn { margin-left: 8px; min-width: 24px; height: 24px; padding: 0 7px; border-radius: 999px;
  color: #fff; font-size: 15px; line-height: 24px; text-align: center; box-sizing: border-box; }
.dchip.now { animation: dbob 1.4s ease-in-out infinite; }
@keyframes dbob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }

#scrim { position: fixed; left: 0; top: 0; right: 0; bottom: 0; background: var(--scrim);
  display: flex; align-items: center; justify-content: center; opacity: 0;
  pointer-events: none; transition: opacity .22s ease-out; }
#scrim.open { opacity: 1; pointer-events: auto; }
#card { width: 1080px; max-width: calc(100vw - 48px); height: 660px; max-height: calc(100vh - 48px);
  background: var(--paper); border-radius: 32px; display: flex; overflow: hidden;
  box-shadow: 0 24px 60px rgba(20, 44, 30, .35);
  transform: translateY(24px) scale(.96); transition: transform .32s cubic-bezier(.2, 1.3, .4, 1); }
#scrim.open #card { transform: none; }
#face { width: 320px; flex: none; display: flex; flex-direction: column; align-items: center;
  padding: 40px 24px 28px; box-sizing: border-box; }
#portrait { width: 240px; height: 240px; }
#who { font-size: 52px; font-weight: 600; margin: 10px 0 0; line-height: 1.05; color: #26352C; }
#sum { font-size: 22px; margin: 8px 0 0; color: #3E5146; text-align: center; }
#done { margin-top: auto; font: 600 24px Fredoka, sans-serif; color: #26352C;
  background: rgba(255, 255, 255, .78); border: 0; border-radius: 999px; padding: 16px 48px; }
#done:active { transform: scale(.97); }
#lists { flex: 1; overflow-y: auto; padding: 36px 44px 32px 40px; -webkit-overflow-scrolling: touch; }
#lists h2 { font-size: 20px; font-weight: 600; color: var(--ink-soft); margin: 26px 0 10px; }
#lists h2:first-child { margin-top: 0; }
.row { display: flex; align-items: baseline; padding: 7px 0; font-size: 24px; line-height: 1.25; }
.when { flex: none; width: 150px; color: var(--ink-soft); font-size: 20px; font-weight: 500; }
.what { flex: 1; }
.chip { display: inline-block; font-size: 15px; font-weight: 600; border-radius: 999px;
  padding: 3px 10px; margin-right: 10px; vertical-align: 3px; background: var(--paper-2); color: var(--ink-soft); }
.empty { font-size: 24px; color: var(--ink-soft); padding: 4px 0 2px; }
.foot { font-size: 16px; color: var(--ink-soft); margin-top: 30px; }
.soft { color: var(--ink-soft); font-size: .8em; margin-left: 6px; }
.lesson { font-size: 27px; font-weight: 500; }
.tt { width: 100%; border-collapse: separate; border-spacing: 4px; }
.tt th { font-size: 15px; font-weight: 600; color: var(--ink-soft); text-align: left; padding: 2px 6px; }
.tt td { font-size: 16px; line-height: 1.2; padding: 6px 8px; border-radius: 10px; background: var(--paper-2); vertical-align: top; }
.tt td small { display: block; font-size: 12px; color: var(--ink-soft); }
.tt td.now, .tt th.now { background: #F3E3A2; color: #26352C; }
.tt td.now small { color: #56675C; }
.tt td.pe { box-shadow: inset 0 0 0 2px #7FB77E; }
#next { transition: opacity .6s; }
.foot .bad { color: var(--warn); }
@media (prefers-reduced-motion: reduce) { #card, #scrim { transition: none; } .dchip.now { animation: none; } }
</style>
</head>
<body>
<canvas id="world"></canvas>
<div id="hud"><div id="clock">--:--</div><div id="date"></div><div id="next"></div></div>
<div id="dates"></div>
<div id="corner"><div>Tap someone to see their week</div><div id="status"></div></div>
<div id="scrim"><section id="card">
  <div id="face"><canvas id="portrait" width="480" height="480"></canvas>
    <h1 id="who"></h1><p id="sum"></p><button id="done">Done</button></div>
  <div id="lists"></div>
</section></div>
<script>
(function () {
"use strict";

// ── CONFIG: who lives in the meadow ─────────────────────────────────────────
// Everything personal is in this block. Edit it and nothing else.
//
// PEOPLE, one entry per creature:
//   name     the label on the name tag; must match `who` in sensor.family_week and
//            sensor.family_extra exactly (the calendar template writes it).
//   aliases  other spellings the calendars use for this person (birthday matching).
//   col      tag and umbrella colour; keep it in step with the Today view's per-person colours.
//   r        body radius in px at depth 1.
//   look     crow | capybara | deer | shark | otter | snail (rigged and animated in parts).
//            bear, bunny, phones, curls, flower are the older whole-sprite looks.
//   tg       how far above the feet the name tag sits, in body radii; ears and flowers differ.
//   adult    narrower, taller body, smaller eyes, brows. Kids get cheeks and a w mouth.
//   glasses  round reading glasses.   bee: a bee circles this one (one person only).
//   phones   headphones.   daisy: a daisy behind one ear.   Both work on any animal.
//   school   this person's items count on the School tag and card.
// The last entry, "House", is the household: bin day, window cleaner, anything nobody owns.
// Swapping someone's animal is changing their look (and tg if the tag sits wrong).
var PEOPLE = [
  { name: "Alex",  col: "#7FC8D2", r: 37, look: "crow",     tg: 2.25, adult: true, glasses: true, bee: true },
  { name: "Jo",    col: "#9A72C8", r: 36, look: "capybara", tg: 2.6,  adult: true, aliases: ["Joanna"] },
  { name: "Rory",  col: "#A3B0F2", r: 40, look: "deer",     tg: 2.75, phones: true, school: true },
  { name: "Mia",   col: "#D4A8F5", r: 36, look: "shark",    tg: 1.6,  school: true },
  { name: "Ivy",   col: "#9EE0B4", r: 31, look: "otter",    tg: 2.55, daisy: true, school: true },
  { name: "House", col: "#E0A050", r: 37, look: "snail",    tg: 2.05 }
];
// The two who get a party on a calendar event titled "Anniversary".
var ANNIVERSARY = ["Alex", "Jo"];
// Home Assistant entities. The first two are required; the rest are optional and a
// missing one blanks only its own part of the School card.
var SENSORS = {
  week: "sensor.family_week",        // every event on every calendar for the next 7 days, tagged who/what/day/at/all_day
  extra: "sensor.family_extra",      // school items, kit, flags, term dates, and which sources could not be checked
  timetable: "sensor.mia_school_week",   // a two-week lesson grid; shown on the School card
  kit: "sensor.ivy_school_kit",          // what kit is needed today
  lunch: "sensor.ivy_lunch",             // the school lunch menu, today and tomorrow
  sun: "sun.sun",
  weather: "weather.forecast_home",
  // Optional extras. null switches that part of the meadow off and nothing else.
  printer: null,                      // e.g. "sensor.a1mini_SERIAL_": a Bambu Lab printer's sensor prefix (ha-bambulab); the workshop builds the print
  letter: "input_text.meadow_letter", // the postie's letters, typed on a phone as "Ivy: tea's at six"
  music: "media_player.music",        // the speaker: the meadow dances while it plays music
  rain: null,                         // e.g. "sensor.rain_sensor": adds rain the forecast misses (see RAIN_STATES)
  trips: "calendar.family"            // events titled "Holiday ..." on this calendar become countdowns
};
// Whose card the optional school sensors belong to.
var SCHOOL_WHO = { timetable: "Mia", kit: "Ivy", lunch: "Ivy" };
// sensor.family_extra names its sources, not people. Map a source name (regex) to the
// person whose card should say "couldn't check", so a missing source does not read
// as a quiet week. The House card lists every missing source.
var SOURCE_OWNER = [[/jo-mail/, "Jo"], [/high-school/, "Rory"], [/primary/, "Ivy"], [/academy/, "Mia"]];
// The order the school kids stand in at the school door, front to back. Put the
// tallest name tag (highest tg) first so the tags open out rather than overlap.
var SCHOOL_LINE = ["Rory", "Ivy", "Mia"];
// What the rain sensor's states mean (SENSORS.rain). Anything else is no reading.
var RAIN_STATES = { wet: ["raining", "wet", "on"], dry: ["none", "dry", "off"] };
// Countdowns in the sky. Birthdays are month-day and must use names from PEOPLE;
// each one throws the party on the day. The fixed days work for anyone.
var DATES = {
  birthdays: { Alex: "03-14", Jo: "06-02", Rory: "01-22", Mia: "10-09", Ivy: "07-27" },
  fixed: [
    { key: "halloween", label: "Halloween", icon: "pumpkin", md: "10-31", rave: "halloween", party: "Happy Halloween!" },
    { key: "bonfire", label: "Bonfire night", icon: "fire", md: "11-05", rave: "bonfire", party: "Bonfire night!" },
    { key: "christmas", label: "Christmas", icon: "tree", md: "12-25", rave: "christmas", party: "Merry Christmas!" },
    { key: "nye", label: "New Year's Eve", icon: "sparkle", md: "12-31", rave: "new years eve", party: "Happy New Year!" }
  ]
};
// Tap shortcuts: a building opens its own dashboard view. null leaves that
// building as scenery. Paths are views in dashboards/wall-panel.yaml.
var VIEW = { home: "/wall-panel/home", music: "/wall-panel/music", printer: "/wall-panel/printer", office: null };
// The office robot: a URL that answers GET with an agent office's state as JSON,
// cross-origin (docs/06-views.md, "A page from another server"). null keeps the
// robot out of the meadow entirely, which is what you want unless you run one.
var OFFICE_URL = null;
// ── end of CONFIG ───────────────────────────────────────────────────────────

var Q = location.search;
var DEMO = location.protocol === "file:" || /[?&]demo\b/.test(Q);
var HOUR = (Q.match(/[?&]hour=([\d.]+)/) || [])[1];          // test hook: fake the clock
var DATE = (Q.match(/[?&]date=(\d{4}-\d\d-\d\d)/) || [])[1];  // test hook: fake the day (countdowns, parties, school days); pair with hour=
var OPEN = (Q.match(/[?&]open=(\w+)/) || [])[1];             // test hook: open a card
var WFORCE = (Q.match(/[?&]weather=(\w+)/) || [])[1];        // test hook: sunny|partly|cloudy|rain|storm|fog|snow|windy
var PFORCE = (Q.match(/[?&]party=([^&]+)/) || [])[1];         // test hook: a name from PEOPLE (any case), or halloween|bonfire|christmas|anniversary for the rave, friend or friend:Pat for the house party, comma-joined for both
var PRFORCE = (Q.match(/[?&]printer=([\w:.]+)/) || [])[1];    // test hook: running:45 | pause:45 | prepare | finish | failed | idle | offline
var LFORCE = (Q.match(/[?&]letter=([^&]+)/) || [])[1];        // test hook: Ivy:hello (url-encoded), delivered a few seconds after boot
var FPS = /[?&]fps\b/.test(Q);                               // test hook: frame rate and per-frame JS time, bottom right
var MFORCE = (Q.match(/[?&]music=(\w+)/) || [])[1];          // test hook: on | off, overrides the speaker
var OFORCE = (Q.match(/[?&]office=([^&]+)/) || [])[1];         // test hook: off (unreachable) | quiet | ask:Name | Name:what it is doing (url-encoded), overrides the office poll
var WARM = +(Q.match(/[?&]warm=([\d.]+)/) || [])[1] || 0;      // test hook: run this many seconds of the sim before the first frame (headless screenshots see fades finished, guests arrived)

// ── Small helpers ───────────────────────────────────────────────────────────
function rgb(h) { var v = parseInt(h.slice(1), 16); return [v >> 16, (v >> 8) & 255, v & 255]; }
function css(a, al) { return al == null ? "rgb(" + (a[0] | 0) + "," + (a[1] | 0) + "," + (a[2] | 0) + ")"
  : "rgba(" + (a[0] | 0) + "," + (a[1] | 0) + "," + (a[2] | 0) + "," + al + ")"; }
function mix(h, h2, t) { var a = rgb(h), b = rgb(h2); return css([a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]); }
function shade(h, k) { var a = rgb(h); return css([a[0] * k, a[1] * k, a[2] * k]); }
function rand(a, b) { return a + Math.random() * (b - a); }
function pick(arr) { return arr[(Math.random() * arr.length) | 0]; }
function dist(a, b) { var dx = a.x - b.x, dy = a.y - b.y; return Math.sqrt(dx * dx + dy * dy); }
function pad2(n) { return (n < 10 ? "0" : "") + n; }
function ymd(d) { return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); }
function canvas(w, h) { var c = document.createElement("canvas"); c.width = Math.ceil(w); c.height = Math.ceil(h); return c; }
function rr(g, x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
var DAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
var DAYS_LONG = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
var MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
var MONTHS_LONG = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
function now() {
  var d = new Date();
  if (DATE) d.setFullYear(+DATE.slice(0, 4), +DATE.slice(5, 7) - 1, +DATE.slice(8, 10));
  if (HOUR) { var h = parseFloat(HOUR); d.setHours(h | 0, Math.round((h % 1) * 60), 0, 0); }
  return d;
}
function dayLabel(ds) {
  var t = now(), today = ymd(t), tm = new Date(t.getTime() + 864e5);
  if (ds === today) return "Today";
  if (ds === ymd(tm)) return "Tomorrow";
  var d = new Date(ds + "T12:00:00"), days = (d - t) / 864e5;
  return DAYS[d.getDay()] + " " + d.getDate() + (days > 6 ? " " + MONTHS[d.getMonth()] : "");
}

// ── Sprites. Everything is baked once, then blitted: this panel is an Android 5
// tablet, and a creature built from paths every frame is ten rasterisations. ─────
var K = 2;          // bake scale, so a sprite stays crisp if the panel reports dpr 2
var INK = "#2B2433";

// Draw a shape twice: grown in the rim colour, then in its fill. Gives every
// silhouette (ears, fluff, shell) one clean outline without stroking overlaps.
function rimmed(g, rim, fill, grow, draw) {
  g.fillStyle = rim; draw(grow); g.fillStyle = fill; draw(0);
}

// only: "eyes" draws just the eyes (a rig piece), "rest" everything else.
function face(g, cx, ey, r, eyes, dx, adult, only) {
  // Grown-ups: smaller, closer eyes, brows, a plain smile, no blush. Same world, less baby.
  var ex = r * (adult ? 0.27 : 0.34), ew = r * (adult ? 0.085 : 0.13), eh = r * (adult ? 0.11 : 0.17);
  if (eyes === "wide") { ew *= 1.3; eh *= 1.3; eyes = "open"; }
  [-1, 1].forEach(function (s) {
    var x = cx + dx + s * ex;
    if (!adult && only !== "eyes") { g.fillStyle = "rgba(255,120,150,.42)";                     // cheeks
      g.beginPath(); g.ellipse(x + s * r * 0.1, ey + r * 0.22, r * 0.14, r * 0.085, 0, 0, 7); g.fill(); }
    if (only === "rest") return;
    g.strokeStyle = INK; g.lineCap = "round"; g.lineWidth = r * (adult ? 0.06 : 0.075);
    if (eyes === "open") {
      g.fillStyle = INK; g.beginPath(); g.ellipse(x, ey, ew, eh, 0, 0, 7); g.fill();
      g.fillStyle = "#fff"; g.beginPath(); g.arc(x - ew * 0.35, ey - eh * 0.4, ew * 0.42, 0, 7); g.fill();
      if (!adult) { g.beginPath(); g.arc(x + r * 0.045, ey + r * 0.06, r * 0.025, 0, 7); g.fill(); }
    } else if (eyes === "shut") {
      g.beginPath(); g.moveTo(x - ew * 0.92, ey); g.quadraticCurveTo(x, ey + ew * 0.77, x + ew * 0.92, ey); g.stroke();
    } else {                                                                  // happy ^ ^
      g.beginPath(); g.moveTo(x - ew * 0.92, ey + ew * 0.38); g.quadraticCurveTo(x, ey - ew, x + ew * 0.92, ey + ew * 0.38); g.stroke();
    }
    if (adult && eyes !== "shut") { g.lineWidth = r * 0.045; g.beginPath();
      g.moveTo(x - r * 0.1, ey - r * 0.21); g.quadraticCurveTo(x, ey - r * 0.26, x + r * 0.1, ey - r * 0.2); g.stroke(); }
  });
  if (only === "eyes") return;
  var mx = cx + dx, my = ey + r * 0.2;
  g.strokeStyle = INK; g.lineCap = "round";
  if (adult) { g.lineWidth = r * 0.045; g.beginPath(); g.arc(mx, my - r * 0.06, r * 0.08, 0.4, Math.PI - 0.4); g.stroke(); return; }
  g.lineWidth = r * 0.05; g.beginPath(); g.moveTo(mx - r * 0.08, my);                     // little w mouth
  g.quadraticCurveTo(mx - r * 0.04, my + r * 0.08, mx, my); g.quadraticCurveTo(mx + r * 0.04, my + r * 0.08, mx + r * 0.08, my); g.stroke();
}

// o: { r, col, look, fluff, adult, glasses, hat }  eyes: open | shut | happy
function creatureSprite(o, eyes, k) {
  k = k || K;
  if (o.look === "snail") return snailSprite(o, eyes, k);
  if (o.look === "crow") return crowSprite(o, eyes, k);
  if (o.look === "shark") return sharkSprite(o, eyes, k);
  if (/^(capybara|deer|otter)$/.test(o.look)) return famSprite(o, eyes, k);
  var r = o.r * k, w = r * 3.6, cy = r * 2.1, h = cy + r * 1.05;
  var c = canvas(w, h), g = c.getContext("2d"), cx = w / 2, col = o.col, feet = cy + r * 0.92;
  var rim = shade(col, 0.6), grow = 1.7 * k, dark = shade(col, 0.82), inner = mix(col, "#FF9FB5", 0.55);
  var ek = o.adult ? 0.8 : 1;                           // grown-ups have neater ears
  // Grown-ups are the same body drawn narrower and taller, pinned at the feet:
  // no longer a ball, so they stop reading as babies.
  var STRETCH = 1.14;
  if (o.adult) { g.save(); g.translate(cx, feet); g.scale(0.84, STRETCH); g.translate(-cx, -feet); }

  // behind the body: feet, tail, ears
  rimmed(g, rim, dark, grow, function (e) { [-1, 1].forEach(function (s) {
    g.beginPath(); g.ellipse(cx + s * r * 0.42, cy + r * 0.8, r * 0.24 + e, r * 0.14 + e, 0, 0, 7); g.fill(); }); });
  if (o.look === "fox") {
    rimmed(g, rim, col, grow, function (e) { g.beginPath(); g.ellipse(cx - r * 1.0, cy + r * 0.05, r * 0.5 + e, r * 0.3 + e, -0.7, 0, 7); g.fill(); });
    g.fillStyle = "#FFF6EA"; g.beginPath(); g.ellipse(cx - r * 1.3, cy - r * 0.26, r * 0.2, r * 0.14, -0.7, 0, 7); g.fill();
  }
  var ears = { bear: "round", puff: "nub", villager: "nub", bunny: "long", fox: "point", phones: "point", flower: "nub", curls: "none" }[o.look];
  [-1, 1].forEach(function (s) {
    if (ears === "round" || ears === "nub") {
      var er = (ears === "round" ? 0.3 : 0.2) * ek, ey = ears === "round" ? -0.72 : -0.74, ex = ears === "round" ? 0.62 : 0.56;
      rimmed(g, rim, col, grow, function (e) { g.beginPath(); g.arc(cx + s * r * ex, cy + r * ey, r * er + e, 0, 7); g.fill(); });

// ── The meadow itself, baked once per size ──────────────────────────────────
var cv = document.getElementById("world"), ctx = cv.getContext("2d");
var W, H, DPR, HZ, TOP, BG, POND;
var LAY = {}, ZONES = [];          // village anchors, and the ellipses nothing wanders into

function bakeBackground() {
  var c = canvas(W * DPR, H * DPR), g = c.getContext("2d"), i;
  g.scale(DPR, DPR);
  var sky = g.createLinearGradient(0, 0, 0, HZ);
  sky.addColorStop(0, "#BFE4F0"); sky.addColorStop(1, "#E9F7EC");
  g.fillStyle = sky; g.fillRect(0, 0, W, HZ + 20);
  function hills(y, amp, col, seed) {
    g.fillStyle = col; g.beginPath(); g.moveTo(0, H);
    for (var x = 0; x <= W; x += 16) g.lineTo(x, y - amp * (0.6 * Math.sin(x / 210 + seed) + 0.4 * Math.sin(x / 97 + seed * 2.3)));
    g.lineTo(W, H); g.closePath(); g.fill();
  }
  hills(HZ - 18, 22, "#B7DFB4", 1.2);
  hills(HZ + 2, 14, "#9ED39E", 4.1);
  var gr = g.createLinearGradient(0, HZ, 0, H);
  gr.addColorStop(0, "#98D194"); gr.addColorStop(1, "#7EC47E");
  g.fillStyle = gr; g.fillRect(0, HZ + 8, W, H);
  hills(HZ + 12, 6, "#98D194", 2.7);
  // bushes on the horizon, behind anything that can walk
  for (i = 0; i < 9; i++) {
    var bx = rand(0, W), by = HZ + rand(4, 16), br = rand(18, 34);
    if (bx < 520 && by < HZ + 20 && i % 2) continue;
    [[0, 0, 1], [-0.7, 0.25, 0.7], [0.7, 0.25, 0.75]].forEach(function (p) {
      g.fillStyle = "#6FB673"; g.beginPath(); g.arc(bx + p[0] * br, by + p[1] * br, br * p[2], 0, 7); g.fill(); });
    g.fillStyle = "rgba(255,255,255,.18)"; g.beginPath(); g.arc(bx - br * 0.3, by - br * 0.35, br * 0.35, 0, 7); g.fill();
  }
  // soft mottles so the grass is not a flat fill
  for (i = 0; i < 90; i++) {
    g.fillStyle = Math.random() < 0.5 ? "rgba(255,255,255,.07)" : "rgba(40,110,50,.06)";
    g.beginPath(); g.ellipse(rand(0, W), rand(HZ + 20, H), rand(30, 110), rand(10, 30), 0, 0, 7); g.fill();
  }
  // pond, half off the bottom-right edge
  POND = { x: W * 0.83, y: H * 0.93, rx: Math.min(210, W * 0.17), ry: 74 };
  g.fillStyle = "#6DB57A"; g.beginPath(); g.ellipse(POND.x, POND.y, POND.rx + 10, POND.ry + 8, 0, 0, 7); g.fill();
  var pg = g.createLinearGradient(0, POND.y - POND.ry, 0, POND.y + POND.ry);
  pg.addColorStop(0, "#9ED8E6"); pg.addColorStop(1, "#6FBBD3");
  g.fillStyle = pg; g.beginPath(); g.ellipse(POND.x, POND.y, POND.rx, POND.ry, 0, 0, 7); g.fill();
  g.strokeStyle = "rgba(255,255,255,.6)"; g.lineWidth = 3; g.lineCap = "round";
  g.beginPath(); g.ellipse(POND.x - 30, POND.y - 22, 60, 14, 0, 3.6, 5.2); g.stroke();
  g.fillStyle = "#5FAE69"; g.beginPath(); g.ellipse(POND.x + 70, POND.y - 12, 26, 12, 0.3, 0.5, 6.0); g.fill();   // lily pad
  g.fillStyle = "#FFB3C7"; g.beginPath(); g.arc(POND.x + 74, POND.y - 16, 6, 0, 7); g.fill();
  layout();
  // tufts and flowers
  for (i = 0; i < 160; i++) {
    var x = rand(0, W), y = rand(HZ + 26, H);
    if (inZone(x, y, 16)) continue;
    g.strokeStyle = "rgba(52,120,60,.45)"; g.lineWidth = 2;
    g.beginPath(); g.moveTo(x - 4, y - 7); g.lineTo(x, y); g.lineTo(x + 1, y - 9); g.moveTo(x, y); g.lineTo(x + 5, y - 6); g.stroke();
  }
  for (i = 0; i < 70; i++) {
    var fx = rand(0, W), fy = rand(HZ + 30, H), fc = pick(["#FFFFFF", "#FFF3A8", "#FFC4D6", "#E4D2FF"]);
    if (inZone(fx, fy, 14)) continue;
    g.fillStyle = fc; for (var p = 0; p < 5; p++) { var a = p / 5 * 6.283;
      g.beginPath(); g.arc(fx + Math.cos(a) * 3.2, fy + Math.sin(a) * 3.2, 2.6, 0, 7); g.fill(); }
    g.fillStyle = "#F4B63C"; g.beginPath(); g.arc(fx, fy, 1.8, 0, 7); g.fill();
  }
  paintProps(g);
  BG = c;
}
// The village. A high street along the back with a road in front of it, the school

// the bandstand, garden, pitch and pond along the bottom. The middle is the family's
// patch, and nothing in the village is allowed to plan a route through it.

function layout() {

    market:  { x: Math.round(W * 0.61),  y: B },
    bus:     { x: Math.round(W * 0.715), y: R + 16 },
    cottage: { x: Math.round(W * 0.79),  y: B },
    mill:    { x: Math.round(W * 0.905), y: B },
    // The printer's workshop goes on the cottage's back plot, below it and left of
    // the woodcutter: the one patch the village had not used. The family patch
    // starts just below its zone.
    shop:    { x: Math.round(W * 0.79),  y: TOP + 172 },
    school:  { x: Math.round(W * 0.075), y: TOP + 190 },
    swing:   { x: Math.round(W * 0.05),  y: H - 160 },
    wood:    { x: Math.round(W * 0.9),   y: TOP + 175 },
    wash:    { x: Math.round(W * 0.925), y: H - 200 },
    garden:  { x: Math.round(W * 0.14),  y: H - 58 },
    band:    { x: Math.round(W * 0.33),  y: H - 30 },
    pitch:   { x: Math.round(W * 0.52),  y: H - 60 },
    fish:    { x: POND.x + Math.cos(3.45) * (POND.rx + 8), y: POND.y + Math.sin(3.45) * (POND.ry + 8), bx: POND.x - POND.rx * 0.5, by: POND.y - POND.ry * 0.3 }
  };
  var L = LAY, lx = Math.round(W * 0.855), sx = L.school.x + 100;
  function back(x, y) { return { x: x, y: y || B + 3, lane: [{ x: x, y: R }] }; }
  DOORS = {
    pub: back(L.pub.x - 30), bakery: back(L.bakery.x - 31), post: back(L.post.x - 18),
    cottage: back(L.cottage.x - 14), mill: back(L.mill.x),

    marketq: back(L.market.x + 10, B + 20), wellq: back(L.well.x + 60, R), busq: back(L.bus.x - 30, R + 12),
    school: { x: L.school.x, y: L.school.y + 3, lane: [{ x: sx, y: L.school.y + 12 }, { x: sx, y: R }] },
    wood: { x: L.wood.x - 34, y: L.wood.y + 4, lane: [{ x: lx, y: L.wood.y + 4 }, { x: lx, y: R }] },
    wash: { x: L.wash.x - 44, y: L.wash.y + 8, lane: [{ x: lx, y: L.wash.y + 8 }, { x: lx, y: R }] },
    left: { x: -24, y: R, lane: [] }, right: { x: W + 24, y: R, lane: [] }
  };
  ZONES = [{ x: POND.x, y: POND.y, rx: POND.rx, ry: POND.ry },
    { x: L.school.x + 5, y: L.school.y + 50, rx: 112, ry: 165 },        // school, yard and swing
    { x: L.wood.x + 30, y: L.wood.y + 90, rx: 105, ry: 165 },           // woodcutter and washing line
    { x: L.garden.x + 20, y: L.garden.y - 8, rx: 140, ry: 52 },
    { x: L.band.x, y: L.band.y - 22, rx: 92, ry: 58 },
    { x: L.pitch.x, y: L.pitch.y, rx: 128, ry: 50 },
    { x: L.fish.x - 10, y: L.fish.y, rx: 46, ry: 30 },
    { x: L.shop.x, y: L.shop.y - 16, rx: 74, ry: 46 }];                 // the workshop plot
}
function inZone(x, y, pad) {
  for (var i = 0; i < ZONES.length; i++) { var z = ZONES[i], dx = (x - z.x) / (z.rx + pad), dy = (y - z.y) / (z.ry + pad);
    if (dx * dx + dy * dy < 1) return z; }

}
// inner: the family's patch. Grazers get everything south of the road.
function inBounds(x, y, inner) {
  return inner ? x > W * 0.16 && x < W * 0.84 && y > TOP + 118 && y < H - 170 : x > 30 && x < W - 30 && y > LAY.R + 16 && y < H - 22;
}
function spot(inner) {
  for (var i = 0; i < 40; i++) {
    var x = inner ? rand(W * 0.16, W * 0.84) : rand(30, W - 30), y = inner ? rand(TOP + 118, H - 170) : rand(LAY.R + 16, H - 22);
    if (!inZone(x, y, 30)) return { x: x, y: y };
  }
  return { x: W / 2, y: (TOP + H) / 2 };
}

  for (var i = 0; i < q.list.length; i++) { var w = q.list[i], s = q.slot(i);
    if (walkV(w.v, s.x, s.y, 26, dt)) w.v.face = q.face;
    if (i > 0 && w.bubT <= 0 && Math.random() < dt * 0.05) { w.bub = pick([BUBS.dots, BUBS.ha, BUBS.sun, BUBS.heart]); w.bubT = 1.4; } }
}
function qFront(q) { var w = q.list[0]; if (!w) return null; var s = q.slot(0); return Math.abs(w.v.x - s.x) + Math.abs(w.v.y - s.y) < 3 ? w : null; }

// ── Guards: the woodcutter and the gardener see foxes off ──
function lookForFox(g, dt) {
  if (SHOO_COOL > 0 || nightness > 0.35) return;
  for (var i = 0; i < things.length; i++) { var f = things[i];
    if (f.kind === "nib" && f.chase && !(f.scared > 0) && dist(f, g.v) < 320 && Math.random() < dt * 0.6) {
      g.mode = "shoo"; g.fox = f; SHOO_COOL = 30; say("!", g.v.x, g.v.y - 46); return; } }
}
function shoo(g, dt) {
  var f = g.fox;
  if (!f || things.indexOf(f) < 0 || f.scared > 0) { g.mode = "home"; return; }
  walkV(g.v, f.x, f.y, 82, dt);
  if (dist(g.v, f) < 42) { f.scared = 6; f.fleeX = f.x < W / 2 ? -70 : W + 70; f.chase = null; f.chaseT = 0; f.idle = false;
    say("shoo!", g.v.x, g.v.y - 50); g.v.happy = 2; g.mode = "home"; }
}

function makeVillage() {
  var S = [], L = LAY, B = L.B, R = L.R;
  WALKERS = []; TRADE = { flour: 1, wood: 3, bread: 1 }; PUBN = 2;
  WX.drops = []; for (var d = 0; d < 170; d++) WX.drops.push({ x: rand(0, W), y: rand(0, H), s: rand(0.7, 1.2) });
  WX.flakes = []; for (d = 0; d < 110; d++) WX.flakes.push({ x: rand(0, W), y: rand(0, H), s: rand(0, 1.5), ph: rand(0, 6) });

  // Weather, fox-shooing cooldown and the walker bookkeeping.
  // Every colour and hat a passer-by can wear, baked one per frame at boot. A sprite
  // baked on first use costs ~25ms on a throttled CPU, most of a 33ms frame.
  var warm = []; VCOLS.forEach(function (c) { HATS.forEach(function (h) { if (warm.indexOf(c + "|" + h) < 0) warm.push(c + "|" + h); }); });
  S.push({ layer: null, t: 3,
    update: function (dt, asleep) {
      if (warm.length) { var wh = warm.pop().split("|"); mkV(wh[0], wh[1], 0, 0); }
      SHOO_COOL -= dt;
      updateWeather(dt);

      updateWalkers(dt);
      // Evening: queues break up and people head home.
      if (nightness > 0.35) { [QS.well, QS.market, QS.bus].forEach(function (q) { while (q.list.length) leaveQ(q, exitDoor()); }); return; }
      this.t -= dt; if (this.t > 0) return;
      this.t = rand(2, 5) * (WX.rain > 0.4 ? 2 : 1);
      if (WX.storm > 0.5) return;                        // a thunderstorm keeps everyone in
      if (WALKERS.length >= 14) return;
      var from = pick([DOORS.left, DOORS.right, DOORS.left, DOORS.right, DOORS.cottage, DOORS.mill, DOORS.post]), r = Math.random();
      if (r < 0.18) errand(from, DOORS.pub, {}, function () { PUBN++; });
      else if (r < 0.36 && QS.well.list.length < 4) errand(from, DOORS.wellq, {}, function (w) { joinQ(QS.well, w); });
      else if (r < 0.54 && QS.bus.list.length < 4) errand(from, DOORS.busq, {}, function (w) { joinQ(QS.bus, w); });
      else if (r < 0.8 && QS.market.list.length < 3) errand(from, DOORS.marketq, {}, function (w) { joinQ(QS.market, w); });
      else errand(from, exitDoor(), {});
    } });

  // Well: a queue, a crank, a bucket each.
  (function () {
    var w0 = L.well, crank = 0, serve = 0;
    QS.well = queue(function (i) { return { x: w0.x + 34 + i * 23, y: B + 14 + (i ? 7 : 0) }; }, -1);
    S.push({ layer: "back",
      update: function (dt) { updateQ(QS.well, dt); var f = qFront(QS.well);
        if (f) { serve += dt; crank += dt * 5; if (serve > 2.6) { serve = 0; f.v.happy = 1.2; leaveQ(QS.well, exitDoor(), ICON.bucket); } } else serve = 0; },
      draw: function () {
        var up = clamp(serve / 2.6, 0, 1), by = B - 30 - up * 22;
        ctx.strokeStyle = "#6B5A4E"; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(w0.x, B - 58); ctx.lineTo(w0.x, by - 6); ctx.stroke();
        ctx.strokeStyle = "#8D6440"; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(w0.x - 18, B - 58); ctx.lineTo(w0.x + 22, B - 58); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(w0.x + 22, B - 58); ctx.lineTo(w0.x + 22 + Math.cos(crank) * 7, B - 58 + Math.sin(crank) * 7); ctx.stroke();
        if (up > 0.05) blit(ICON.bucket, w0.x, by + 8, 1, 1, 1, 1);
      } });
  })();

  // Pub: people go in; every so often one comes out wobbly. A cat hops between roofs.
  (function () {
    var p = L.pub, t = rand(6, 14), cat = { on: 0, from: 0, hop: 0, t: rand(20, 40) };
    var roofs = [{ x: p.x + 6, y: B - 98 }, { x: L.bakery.x - 8, y: B - 126 }];
    S.push({ layer: "back",
      update: function (dt, asleep) {
        cat.t -= dt; if (cat.hop > 0) cat.hop = Math.max(0, cat.hop - dt / 0.9);
        if (!asleep && cat.t < 0 && WX.rain < 0.3) { cat.from = cat.on; cat.on = 1 - cat.on; cat.hop = 1; cat.t = rand(25, 55); }
        if (nightness > 0.6) return;
        t -= dt;
        if (t < 0) { t = rand(10, 22); if (PUBN > 0) { PUBN--; errand(DOORS.pub, exitDoor(), { wobble: true, speed: 26 }); } }
      },
      draw: function (time, asleep) {
        if (WX.rain > 0.3) return;                                    // cats do not do rain
        var a = roofs[cat.from], b = roofs[cat.on], k = 1 - cat.hop;
        var x = a.x + (b.x - a.x) * k, y = a.y + (b.y - a.y) * k - Math.sin(k * Math.PI) * (cat.hop > 0 ? 44 : 0), face = b.x > a.x ? 1 : -1;
        ctx.strokeStyle = "#5F6270"; ctx.lineWidth = 3; ctx.lineCap = "round";
        var sw = asleep ? 0 : Math.sin(time * 1.8) * 5;
        ctx.beginPath(); ctx.moveTo(x - face * 6, y - 3); ctx.quadraticCurveTo(x - face * 16, y - 4, x - face * 14 + sw, y - 16); ctx.stroke();
        blit(ICON.cat, x, y + 2, face, 1, 1, 1);
      },
      light: function (a) { ctx.fillStyle = "rgba(255,212,120," + (0.9 * a).toFixed(2) + ")";
        rr(ctx, p.x - 4, B - 56, 20, 16, 4); ctx.fill(); rr(ctx, p.x + 30, B - 56, 20, 16, 4); ctx.fill(); } });
  })();

  // Bakery: bakes with the miller's flour on the woodcutter's logs, sends loaves to the stall.
  (function () {
    var b = L.bakery, smoke = 0, burn = 50, bake = rand(6, 14), busy = false;
    S.push({ layer: "back",
      update: function (dt, asleep) {
        smoke -= dt;
        if (smoke < 0 && !asleep) { smoke = TRADE.wood > 0 ? rand(0.3, 0.6) : rand(1.8, 2.8);
          parts.push({ kind: "smoke", x: b.x + 38 + rand(-2, 2), y: B - 138, vx: rand(4, 10), vy: -15, life: 3.6, max: 3.6 }); }
        burn -= dt; if (burn < 0) { burn = 50; if (TRADE.wood > 0) TRADE.wood--; }
        if (asleep || nightness > 0.35 || busy) return;
        bake -= dt;
        if (bake < 0 && TRADE.flour > 0 && TRADE.bread < 3) {
          bake = rand(25, 45); TRADE.flour--; busy = true;
          errand(DOORS.bakery, DOORS.marketside, { col: "#F3DE7C", hat: "chef", carry: ICON.loaf, speed: 26 }, function (w) {
            TRADE.bread = Math.min(3, TRADE.bread + 1); w.v.happy = 1.5; puff("heart", w.v.x, w.v.y - 44, 1, "#FF7FA0");
            leg(w, route(DOORS.marketside, DOORS.bakery), function () { busy = false; });
          });
        } else if (bake < 0) bake = 8;
      },
      draw: function () {
        for (var i = 0; i < TRADE.wood; i++) { var x = b.x + 76 + (i % 3) * 13 + (i >= 3 ? 6.5 : 0), y = B - 6 - (i >= 3 ? 11 : 0);
          ctx.fillStyle = "#8A5A36"; ctx.beginPath(); ctx.arc(x, y, 7, 0, 7); ctx.fill();
          ctx.fillStyle = "#E2C08E"; ctx.beginPath(); ctx.arc(x, y, 5, 0, 7); ctx.fill(); }
        for (i = 0; i < TRADE.flour; i++) blit(ICON.sack, b.x - 62 + i * 9, B + 2, 1, 1, 1, 1);
      },
      light: function (a) {
        ctx.globalAlpha = a * 0.5; ctx.drawImage(GLOW, b.x - 6, B - 70, 56, 56); ctx.globalAlpha = 1;
        ctx.fillStyle = "rgba(255,212,120," + (0.9 * a).toFixed(2) + ")"; rr(ctx, b.x + 4, B - 56, 36, 28, 5); ctx.fill();
      } });
  })();

  // Post office: the postie does a round of three doors. POSTIE.busy is shared with
  // the letter run below, so there is one postie on the road at a time.
  (function () {
    var t = rand(6, 16), stops = ["school", "pub", "bakery", "cottage", "mill"];
    S.push({ layer: null,
      update: function (dt, asleep) {
        if (asleep || nightness > 0.35 || POSTIE.busy) return;
        t -= dt; if (t > 0) return; t = rand(30, 55);
        if (LETTER.queue.length) return;                                      // a real letter goes first
        POSTIE.busy = true;
        var list = stops.slice().sort(function () { return Math.random() - 0.5; }).slice(0, 3), at = DOORS.post;
        var w = walker(DOORS.post, { col: "#F6C28B", hat: "postcap", speed: 32 });
        (function next() {
          var to = list.length ? DOORS[list.shift()] : DOORS.post, from = at; at = to;
          if (to === DOORS.post) { leg(w, route(from, to), function () { POSTIE.busy = false; }); return; }
          leg(w, route(from, to), function () {
            parts.push({ kind: "icon", icon: ICON.letter, x: w.v.x, y: w.v.y - 40, vx: -w.v.face * 12, vy: -40, life: 0.8, max: 0.8 });
            puff("heart", to.x, to.y - 50, 1, "#FF7FA0"); w.pause = 0.9; w.v.happy = 1; next();
          }, ICON.letter);
        })();
      }, draw: function () {} });
  })();

  // Letters from a phone (SENSORS.letter, see LETTER). The postie takes
  // the envelope off the road and across the meadow to whoever it names, following
  // them if they wander. Post office hours only: a letter sent after dark, or to
  // someone who is out, waits on the postbox until it can go.
  (function () {
    var run = null, PB = { x: L.post.x + 57, y: B - 34 };
    S.push({ layer: "back",
      update: function (dt, asleep) {
        if (run) {
          var w = run.w, t = run.t;
          if (run.st === "road") return;                                     // on a leg; its callback moves us on
          if (run.st === "walk") {
            if (asleep || nightness > 0.6) { run.st = "back"; w.q = null; leg(w, fromHere(w, DOORS.post), function () { POSTIE.busy = false; run = null; }); LETTER.queue.unshift(run.letter); return; }
            var gx = t.x - t.face * t.r * 1.2, gy = t.y + 4;
            if (walkV(w.v, gx, gy, 36, dt) || Math.abs(w.v.x - t.x) + Math.abs(w.v.y - t.y) < t.r * 1.6) {
              t.letter = run.letter; t.happy = 2.2; t.jump = 0.6; say("!", t.x, t.y - t.r * 2.6);
              parts.push({ kind: "icon", icon: ICON.letter, x: w.v.x, y: w.v.y - 40, vx: (t.x - w.v.x) * 1.5, vy: -50, life: 0.7, max: 0.7 });
              w.v.happy = 1.5; w.v.face = t.x > w.v.x ? 1 : -1; w.carry = null; w.q = null; run.st = "back";
              leg(w, fromHere(w, DOORS.post), function () { POSTIE.busy = false; run = null; });
            }
          }
          return;
        }
        if (!LETTER.queue.length || asleep || nightness > 0.35 || POSTIE.busy) return;
        var L1 = LETTER.queue[0], to = fam.filter(function (f) { return f.person.name === L1.to; })[0];
        if (!to || offStage(to)) return;                                     // out: it waits
        LETTER.queue.shift(); POSTIE.busy = true;
        var w2 = walker(DOORS.post, { col: "#F6C28B", hat: "postcap", speed: 34 });
        run = { w: w2, t: to, letter: L1, st: "road" };
        leg(w2, route(DOORS.post, { x: to.x, y: R, lane: [] }), function () { run.st = "walk"; w2.q = run; w2.carry = ICON.letter; }, ICON.letter);
      },
      draw: function (time) {
        // waiting mail sits on the postbox
        if (LETTER.queue.length && !run) blit(ICON.letter, PB.x, PB.y + Math.sin(time * 2) * 1.5, 1, 1, 1, 1.4);
      } });
  })();

  // Market: a stallholder, a queue, and bread when the baker has been.
  (function () {
    var m = L.market, keeper = mkV("#F29E8E", "cap", m.x, B - 44), k = 0, serve = 0;
    QS.market = queue(function (i) { return { x: m.x + 10 + i * 25, y: B + 20 }; }, -1);
    S.push({ layer: "back",
      update: function (dt, asleep) {
        tickV(keeper, dt); updateQ(QS.market, dt);
        if (asleep) return;
        k += dt; keeper.x = m.x + Math.sin(k * 0.7) * 16; keeper.face = Math.cos(k * 0.7) > 0 ? 1 : -1;
        var f = qFront(QS.market);
        if (f) { keeper.face = 1; serve += dt;
          if (serve > 2) { serve = 0; keeper.happy = 2; f.v.happy = 2;
            parts.push({ kind: "coin", x: f.v.x - 6, y: f.v.y - 40, vx: -30, vy: -70, life: 0.8, max: 0.8 });
            var gets = ICON.apple; if (TRADE.bread > 0) { TRADE.bread--; gets = ICON.loaf; }
            leaveQ(QS.market, exitDoor(), gets); } } else serve = 0;
      },
      draw: function (time, asleep) {
        drawV(keeper, asleep, true); blit(MFRONT, m.x, m.y, 1, 1, 1, 1);
        for (var i = 0; i < TRADE.bread; i++) blit(ICON.loaf, m.x - 50 + (i % 2) * 18, m.y - 38 - (i > 1 ? 7 : 0), 1, 1, 1, 1);
      } });
  })();

  // Bus: a pony cart crosses the high street, stops, takes the queue, drops people off.
  (function () {
    var b = L.bus, cart = { x: -200, st: "off", t: rand(12, 25), board: 0, wheel: 0 }, pony = mkV("#C69C6D", "none", -200, R + 8, 17);
    QS.bus = queue(function (i) { return { x: b.x - 30 - i * 23, y: R + 13 }; }, 1);
    var stopX = b.x + 64;
    S.push({ layer: "back", late: true,
      update: function (dt, asleep) {
        updateQ(QS.bus, dt); tickV(pony, dt);
        var v = 0;
        if (cart.st === "off") { cart.t -= dt; if (cart.t < 0 && nightness < 0.35) { cart.st = "in"; cart.x = -120; } }
        else if (cart.st === "in") { v = Math.min(70, 16 + (stopX - cart.x) * 1.2); cart.x += v * dt;
          if (cart.x >= stopX - 0.5) { cart.x = stopX; cart.st = "stop"; cart.t = 4; cart.board = 0.6; } }
        else if (cart.st === "stop") { cart.t -= dt; cart.board -= dt;
          if (cart.board < 0 && QS.bus.list.length) { var w = QS.bus.list.shift(); WALKERS.splice(WALKERS.indexOf(w), 1);
            puff("heart", cart.x - 50, R - 30, 1, "#FF7FA0"); cart.board = 0.6; cart.t = Math.max(cart.t, 1.2); }
          if (cart.t < 0) {
            for (var n = (Math.random() * 3) | 0; n > 0; n--) {
              var off = { x: cart.x - 40 - n * 10, y: R + 10, lane: [] };
              errand(off, DOORS[pick(["cottage", "mill", "post", "pub", "bakery", "school"])], {});
            }
            cart.st = "out"; }
        } else { v = Math.min(70, (cart.v || 0) + 40 * dt); cart.v = v; cart.x += v * dt; if (cart.x > W + 220) { cart.st = "off"; cart.v = 0; cart.t = rand(40, 75); } }
        pony.x = cart.x; pony.y = R + 8; pony.moving = v > 1; if (v > 1) pony.phase += v * dt / (pony.r * 0.9); pony.face = 1;
        cart.wheel += v * dt / 9;
      },
      draw: function () {
        if (cart.st === "off") return;
        var wx = cart.x - 50;
        blit(ICON.wagon, wx, R + 4, 1, 1, 1, 1);
        [-22, 20].forEach(function (o) { var cx = wx + o, cy = R + 2;
          ctx.fillStyle = "#6B4A34"; ctx.beginPath(); ctx.arc(cx, cy, 8, 0, 7); ctx.fill();
          ctx.strokeStyle = "#D9B27A"; ctx.lineWidth = 1.6; ctx.beginPath();
          for (var s = 0; s < 3; s++) { var a = cart.wheel + s * 1.047; ctx.moveTo(cx - Math.cos(a) * 6, cy - Math.sin(a) * 6); ctx.lineTo(cx + Math.cos(a) * 6, cy + Math.sin(a) * 6); }
          ctx.stroke(); });
        drawV(pony, false);
      } });
  })();

  // Windmill: sails always turning (faster in a shower); the miller takes flour to the bakery.
  (function () {
    var m = L.mill, ang = rand(0, 6), t = rand(8, 20), busy = false;
    S.push({ layer: "back",
      update: function (dt, asleep) {
        ang += dt * (asleep ? 0.12 : 0.45 + WX.rain * 0.7) + dt * WX.wind * 1.4;
        if (asleep || nightness > 0.35 || busy) return;
        t -= dt; if (t > 0) return;
        if (TRADE.flour >= 3) { t = 10; return; }
        t = rand(35, 60); busy = true;
        errand(DOORS.mill, DOORS.bakery, { col: "#E8C3A0", hat: "cap", carry: ICON.sack, speed: 24 }, function (w) {
          TRADE.flour = Math.min(3, TRADE.flour + 1); w.v.happy = 1.4;
          leg(w, route(DOORS.bakery, DOORS.mill), function () { busy = false; });
        });
      },
      draw: function () {
        var hx = m.x, hy = B - 124;
        ctx.save(); ctx.translate(hx, hy);
        for (var s = 0; s < 4; s++) { ctx.save(); ctx.rotate(ang + s * Math.PI / 2);
          ctx.fillStyle = "#8D6440"; ctx.fillRect(-2, 6, 4, 74);
          ctx.fillStyle = "rgba(247,241,230,.95)"; ctx.fillRect(3, 16, 15, 62);
          ctx.strokeStyle = "#B3A48C"; ctx.lineWidth = 1; ctx.strokeRect(3, 16, 15, 62);
          ctx.beginPath(); for (var y = 28; y < 78; y += 12) { ctx.moveTo(3, y); ctx.lineTo(18, y); } ctx.stroke();
          ctx.restore(); }
        ctx.fillStyle = "#7E4331"; ctx.beginPath(); ctx.arc(0, 0, 6, 0, 7); ctx.fill();
        ctx.restore();
      },
      light: function (a) { ctx.fillStyle = "rgba(255,212,120," + (0.85 * a).toFixed(2) + ")"; rr(ctx, m.x - 8, B - 84, 16, 18, 4); ctx.fill(); } });
  })();

  // Cottage: the window at night, and the kit bag by the door when the kit sensor
  // says kit is needed (see kitBag).
  S.push({ layer: "back", update: function () {},                         // "back", or draw() never runs
    draw: function () { if (kitBag()) blit(ICON.bag, L.cottage.x + 6, B + 3, 1, 1, 1, 1); },
    light: function (a) { ctx.fillStyle = "rgba(255,212,120," + (0.85 * a).toFixed(2) + ")"; rr(ctx, L.cottage.x + 6, B - 44, 26, 20, 4); ctx.fill(); } });

  // Workshop: the Bambu A1 Mini's job as a building. The plot is bare until a job
  // exists; then a scaffold, walls, a roof and a sign go up as the print's progress
  // rises, with a builder hammering. Pause sits him down, failed knocks it flat,
  // finish rings a bell and hangs bunting. The finished building stays until the
  // next job starts or the printer has been idle half an hour. Offline, unknown or
  // unreachable is the bare plot: a missing sensor never builds anything.
  (function () {
    var s = L.shop, v = mkV("#E8C3A0", "cap", s.x + 62, s.y + 4), sw = 0, st = "empty", stage = 0, bell = 0, idleT = 0, hold = 0, bub = 0, smoke = 0;
    function stageFor(p) { return p < 12 ? 0 : p < 40 ? 1 : p < 70 ? 2 : p < 95 ? 3 : 4; }
    function collapse() { for (var i = 0; i < 4; i++) puff("poof", s.x + rand(-40, 40), s.y - rand(10, 60), 4, "#FFFFFF");
      puff("chip", s.x, s.y - 30, 12, "#C9A06A"); say("oops!", s.x, s.y - 80); v.face = -1; }
    S.push({ layer: "back", v: v,
      update: function (dt, asleep) {
        tickV(v, dt); bell = Math.max(0, bell - dt); bub -= dt; smoke -= dt; hold += dt;
        var ps = printerState(), next;
        if (ps === "running" || ps === "pause") next = ps;
        else if (/^(prepare|slicing|init)$/.test(ps)) next = "prep";
        else if (ps === "finish") next = "done";
        else if (ps === "failed") next = "failed";
        else if (ps === "idle" && (st === "done" || st === "failed")) { idleT += dt; next = idleT > 30 * 60 ? "empty" : st; }
        else next = "empty";
        if (ps !== "idle") idleT = 0;
        if (next !== st) {
          var was = st; st = next; hold = 0;
          if (st === "failed") collapse();
          else if (st === "done") { bell = 3; stage = 4; say("ding!", s.x, s.y - 100); puff("heart", s.x, s.y - 70, 4, "#FF7FA0"); v.happy = 3; }
          else if (st === "running" || st === "prep" || st === "pause") { if (was === "empty" || was === "done" || was === "failed") stage = st === "prep" ? 0 : stageFor(PR.progress); }
        }
        if (st === "running") {
          var want = stageFor(PR.progress);
          if (want > stage && hold > 1.5) { stage = want; hold = 0; puff("chip", s.x + rand(-30, 30), s.y - 20 - stage * 12, 6, "#D9B27A"); v.happy = 1; }
          v.face = -1; sw += dt / 0.9; if (sw >= 1) { sw = 0; if (Math.random() < 0.5) puff("chip", s.x + 30, s.y - 14 - stage * 8, 2, "#D9B27A"); }

// ── Tap shortcuts ───────────────────────────────────────────────────────────
// A building opens its own dashboard view (VIEW, in CONFIG), so the kids skip the up/down

  try {
    var P = window.parent;

  if (VIEW.music && x > bs.x - 95 && x < bs.x + 95 && y > top0 && y < bs.y + 22) {
    puff("note", bs.x + rand(-30, 30), bs.y - 100, 5, "#D9534F"); setTimeout(function () { goView(VIEW.music); }, 380); return; }
  // The blue cottage, the family's house: the Home view (the room the panel lives in)
  var ct = LAY.cottage;
  if (VIEW.home && x > ct.x - 58 && x < ct.x + 58 && y > ct.y - 110 && y < ct.y + 10) {
    puff("heart", ct.x + 18, ct.y - 50, 3, "#FF7FA0"); setTimeout(function () { goView(VIEW.home); }, 380); return; }
  // Everyone else just enjoys the attention.
  for (i = 0; i < things.length; i++) { t = things[i];
    if (t.kind !== "fam" && Math.abs(x - t.x) < t.r * 1.8 && Math.abs(y - (t.y - t.r)) < t.r * 1.8) {
      t.jump = 0.6; t.happy = 1.2; t.flee = 0; puff("heart", t.x, t.y - t.r * 2, 1, "#FF7FA0"); return; } }
});

// Inside the dashboard's iframe card the side keys land here, not on the page that
// runs crestron-keys.js. Hand them up so up/down still pan between views.
if (window.parent !== window) ["keydown", "keyup", "keypress"].forEach(function (type) {
  document.addEventListener(type, function (e) {
    try { var ev = new KeyboardEvent(type, { key: e.key, code: e.code, bubbles: true, cancelable: true });
      if (!window.parent.document.dispatchEvent(ev)) e.preventDefault(); }
    catch (err) { console.warn("meadow: key forward failed", err); }
  }, true);
});

// Taps here never reach the parent page, so tell it the panel is in use:
// crestron-keys.js counts this as activity for its idle and backlight timers.
if (window.parent !== window) document.addEventListener("pointerdown", function () {
  try { window.parent.document.dispatchEvent(new Event("crestron-activity")); }
  catch (err) { console.warn("meadow: activity forward failed", err); }
}, true);

// ── Boot ────────────────────────────────────────────────────────────────────
function size() {
  W = window.innerWidth; H = window.innerHeight; DPR = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = W * DPR; cv.height = H * DPR; cv.style.width = W + "px"; cv.style.height = H + "px";
  HZ = Math.round(H * 0.27); TOP = HZ + 44;
  bakeBackground();
}
var last = 0, lastHud = 0, clock0 = performance.now(), FPSN = 0, FPSMS = 0, FPS0 = 0, FPST = "";
function frame(ms) {
  requestAnimationFrame(frame);
  if (ms - last < 31) return;                           // 30 fps is plenty for a wall, and kinder to it
  var dt = Math.max(0, Math.min(0.1, (ms - last) / 1000)); last = ms;
  nightness = sleepCurve(now(), PARTY ? 21.5 : 20.5); DARK = darkness(now());
  var t0 = FPS ? performance.now() : 0;
  update(dt); draw((ms - clock0) / 1000);
  if (FPS) { FPSN++; FPSMS += performance.now() - t0; if (ms - FPS0 >= 2000) { FPST = (FPSN * 1000 / (ms - FPS0)).toFixed(1) + " fps \u00b7 " + (FPSMS / FPSN).toFixed(1) + " ms"; FPSN = 0; FPSMS = 0; FPS0 = ms; }
    ctx.font = "600 16px Fredoka"; ctx.textAlign = "right"; ctx.textBaseline = "bottom"; ctx.fillStyle = "#000"; ctx.fillRect(W - 170, H - 26, 170, 26); ctx.fillStyle = "#FFF"; ctx.fillText(FPST, W - 8, H - 4); }
  if (ms - lastHud > 1000) { lastHud = ms; hud(); }
}
function start() {
  // Tags go up before any data: if Home Assistant is down at boot, everyone still has a name.
  size(); setup(); refreshTags(); load(); nightness = sleepCurve(now(), 20.5); DARK = darkness(now()); hud();
  loadMusic();                                                                   // before the warm-up, so ?music=on is seen by it
  if (WARM) { nightness = sleepCurve(now(), PARTY ? 21.5 : 20.5); for (var wi = 0; wi < Math.min(WARM, 120) * 30; wi++) update(1 / 30); }
  setInterval(load, 5 * 60000);
  setTimeout(loadLive, DEMO ? 2500 : 1500); setInterval(loadLive, 45000);      // the printer and the letters
  setInterval(loadMusic, 10000);                                                 // the speaker, for the dancing
  setTimeout(loadOffice, DEMO ? 2000 : 1200); setInterval(loadOffice, 10000);    // the agent office, for the robot
  requestAnimationFrame(frame);
  window.addEventListener("resize", function () { size(); VILLAGE = makeVillage(); makeWeatherSprites(); });   // positions are screen fractions
  // ?dbg exposes the sim for a headless check (positions, duties, the printer, the letters).
  if (/[?&]dbg\b/.test(Q)) window.meadow = { fam: fam, LETTER: LETTER, pr: function () { return PR; }, music: function () { return { m: MUSIC, t: MUSIC_T, dance: DANCE, sign: SIGN && { w: SIGN.w, h: SIGN.h } }; }, fps: function () { return FPST; }, isMusic: isMusic, state: printerState, open: openCard, shop: openShop,
    office: function () { return { o: OFFICE, robot: ROBOT && { x: ROBOT.x, y: ROBOT.y, bub: ROBOT.bubBox } }; }, officeLine: officeLine, nav: function () { return NAVS; }, go: goView };
  if (OPEN === "school") setTimeout(openSchool, 900);
  else if (OPEN === "workshop") setTimeout(openShop, 900);
  else if (OPEN) setTimeout(function () { var t = fam.filter(function (f) { return f.person.name.toLowerCase() === OPEN.toLowerCase(); })[0]; if (t) openCard(t); }, 900);
}
(document.fonts && document.fonts.load ? document.fonts.load("600 20px Fredoka").catch(function (e) { console.warn("font", e); }) : Promise.resolve()).then(start);
})();
</script>
