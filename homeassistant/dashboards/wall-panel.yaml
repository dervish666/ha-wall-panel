# Wall panel dashboard. Built on a Crestron TSW-1060 in a living room:
# 1280x800, always dark, never scrolls. Frosted glass over a wallpaper: the
# theme (themes/wall-panel.yaml) makes every ha-card glass, so a card here is
# glass unless it says otherwise.
#
# Register it in configuration.yaml as the `wall-panel` dashboard (see
# configuration.example.yaml). It needs HACS: Mushroom and card-mod.
#
# Views, in side-key order: meadow (the family, landing view), today (the
# family agenda), home (the room), lights, printer. Then the subviews: two
# example person pages (person-alex, person-mia) and three detail pages
# (detail-coming-up, detail-tomorrow, detail-school), all reached by tapping
# a panel on Today.
#
# Every entity id below is a placeholder. Search for light., sensor., switch.,
# media_player. and a1mini_SERIAL and swap in your own. The people are Alex,
# Jo, Rory, Mia, Ivy and House: the names come from the calendar owner map in
# configuration.example.yaml, so change both together.
#
# Traps, all learned the hard way on this panel:
#
# 1. Card content uses a LITERAL block scalar (|-), never folded (>-). A
#    folded scalar joins lines with spaces and silently collapses a list.
# 2. card_mod reaches the ha-card and ha-markdown ELEMENTS but cannot cross
#    into their shadow roots, so `ha-markdown h2`, `ul`, `li` and
#    `.card-header` are all dead. Only inherited properties and CSS custom
#    properties (--ha-card-header-font-size, --ha-card-header-color,
#    --card-primary-font-size, --ha-font-weight-normal) get through.
# 3. Line breaks inside a markdown card are explicit `<br>` tags joined in
#    Jinja, not list items: bullets read as a document, not a display.
# 4. Every panel has a fixed height and overflow hidden, and every
#    list is capped, because the view must never grow past 800px: a taller
#    column scrolls, and a wall panel with a scrollbar is a bug.
title: Wall Panel
views:

  # ── Meadow: the family as creatures in a little village ───────────────
  # www/meadow.html in an iframe, full screen. The page reads sensor.family_week
  # and sensor.family_extra itself with this browser's HA token, and hands the
  # side keys up to crestron-keys.js so up/down still pan. Bump ?v= on every
  # push: /local/ is cached for a month (the docs cover this cache trap).
  - title: Meadow
    path: meadow
    type: panel
    theme: Wall Panel
    cards:
      - type: iframe
        url: /local/meadow.html?v=9
        card_mod:
          style: |
            ha-card {
              border: none !important;
              border-radius: 0 !important;
              background: none !important;
              box-shadow: none !important;
              overflow: hidden;
            }

  # ── Today: the whole family's day ─────────────────────────────────────
  # Four columns: the ambient column (clock, sky, what is next), the adults,
  # the kids, the house. Fed by sensor.family_today and sensor.family_week
  # (configuration.example.yaml). Tapping a person's panel opens their
  # subview; only Alex and Mia have one here, the rest say how to add theirs.
  - title: Today
    path: today
    type: sections
    max_columns: 4
    theme: Wall Panel
    sections:

      # ── Ambient ──────────────────────────────────────────────────────
      # Heights come from grid rows (56px each, 8px gaps): 4+4+3+1 rows and
      # three gaps make 760px, the same as the other columns.
      - type: grid
        cards:
          - type: custom:mushroom-legacy-template-card
            primary: "{{ now().strftime('%H:%M') }}"
            secondary: "{{ now().strftime('%A %-d %B') }}"
            icon: ""
            tap_action: { action: none }
            card_mod:
              style: |
                ha-card {
                  background: none !important;
                  border: none !important;
                  box-shadow: none !important;
                  backdrop-filter: none !important;
                  -webkit-backdrop-filter: none !important;
                  padding: 8px 6px 0 6px;
                  --card-primary-font-size: 92px;
                  --card-primary-font-weight: 600;
                  --card-primary-line-height: 1;
                  --card-primary-letter-spacing: -0.03em;
                  --card-secondary-font-size: 22px;
                  --card-secondary-font-weight: 500;
                  --card-secondary-line-height: 1.4;
                }
            grid_options: { columns: 12, rows: 4 }

          - type: weather-forecast
            entity: weather.forecast_home
            forecast_type: daily
            show_current: true
            show_forecast: true
            name: " "
            card_mod:
              style: |
                ha-card { padding: 10px 14px 8px 14px; overflow: hidden; }
                .content { --mdc-icon-size: 56px; }
            grid_options: { columns: 12, rows: 4 }

          # The next three timed events across the family, today first and
          # then tomorrow, so the panel still says something in the evening.
          - type: markdown
            title: Coming up
            tap_action: { action: navigate, navigation_path: /wall-panel/detail-coming-up }
            content: |-
              {%- set today = state_attr('sensor.family_today','events') or [] -%}
              {%- set week = state_attr('sensor.family_week','events') or [] -%}
              {%- set ts = state_attr('sensor.family_today','checked_at') -%}
              {%- set hm = now().strftime('%H:%M') -%}
              {%- set d1 = (now() + timedelta(days=1)).strftime('%Y-%m-%d') -%}
              {%- set later = today | rejectattr('all_day') | selectattr('at','gt',hm) | list -%}
              {%- set tmrw = week | selectattr('day','eq',d1) | rejectattr('all_day') | list -%}
              {%- set ns = namespace(l=[]) -%}
              {%- for e in later[:3] -%}
              {%- set ns.l = ns.l + ['**' ~ e.at ~ '** ' ~ e.what ~ ' · ' ~ e.who] -%}
              {%- endfor -%}
              {%- for e in tmrw[:(3 - (ns.l | count))] -%}
              {%- set ns.l = ns.l + ['**Tomorrow ' ~ e.at ~ '** ' ~ e.what ~ ' · ' ~ e.who] -%}
              {%- endfor -%}
              {%- if ts is none -%}
              {%- set ns.l = ['*The calendar feed has not reported yet*'] -%}
              {%- elif ((now() - as_datetime(ts)).total_seconds() / 60) | round > 20 -%}
              {%- set ns.l = ns.l + ['*Feed stale since ' ~ as_local(as_datetime(ts)).strftime('%H:%M') ~ '*'] -%}
              {%- endif -%}
              {{ ns.l | join('<br>') if ns.l else '*Nothing timed today or tomorrow*' }}
            card_mod:
              style: |
                ha-card { overflow: hidden; --ha-font-weight-normal: 600; }
                ha-markdown { font-size: 20px; line-height: 1.4; font-weight: 400; }
            grid_options: { columns: 12, rows: 3 }

          - type: custom:mushroom-legacy-template-card
            primary: >-
              {{ states('sensor.kitchen_temperature') | float(0) | round(1) }}° kitchen ·
              {{ states('sensor.upstairs_temperature') | float(0) | round(1) }}° upstairs
            icon: ""
            tap_action: { action: none }
            card_mod:
              style: |
                ha-card {
                  background: none !important;
                  border: none !important;
                  box-shadow: none !important;
                  backdrop-filter: none !important;
                  -webkit-backdrop-filter: none !important;
                  padding: 0 6px;
                  --card-primary-font-size: 16px;
                  --card-primary-font-weight: 500;
                  --card-primary-color: rgba(233,238,243,.64);
                }
            grid_options: { columns: 12, rows: 1 }

      # ── The adults ───────────────────────────────────────────────────
      # Two panels a column, 6 grid rows (376px) each: 760px, like every column.
      - type: grid
        cards:
          - type: markdown
            title: Alex
            tap_action: { action: navigate, navigation_path: /wall-panel/person-alex }
            content: |-
              {%- set rows = state_attr('sensor.family_today','events') or [] -%}
              {%- set mine = rows | selectattr('who','eq','Alex') | list -%}
              {%- set ns = namespace(l=[]) -%}
              {%- for e in mine[:9] -%}
              {%- set ns.l = ns.l + ['**' ~ ('All day' if e.all_day else e.at) ~ '** ' ~ e.what] -%}
              {%- endfor -%}
              {%- if mine | count > 9 -%}{%- set ns.l = ns.l + ['*+' ~ (mine | count - 9) ~ ' more*'] -%}{%- endif -%}
              {%- if not ns.l -%}
              {%- set today = now().strftime('%Y-%m-%d') -%}
              {%- set d1 = (now() + timedelta(days=1)).strftime('%Y-%m-%d') -%}
              {%- set wk = (state_attr('sensor.family_week','events') or []) | selectattr('who','eq','Alex') | rejectattr('day','eq',today) | list -%}
              {%- if wk -%}
              {%- set e = wk[0] -%}
              {%- set ns.l = ['*Nothing on today*', '', '**Next** ' ~ ('Tomorrow' if e.day == d1 else as_local(as_datetime(e.day)).strftime('%A')) ~ ('' if e.all_day else ' ' ~ e.at), e.what] -%}
              {%- else -%}
              {%- set ns.l = ['*Nothing on this week*'] -%}
              {%- endif -%}
              {%- endif -%}
              {{ ns.l | join('<br>') }}
            card_mod:
              style: |
                ha-card {
                  overflow: hidden;
                  --ha-card-header-color: #7FC8D2;
                  --ha-font-weight-normal: 600;
                }
                ha-markdown { font-size: 20px; line-height: 1.4; font-weight: 400; }
            grid_options: { columns: 12, rows: 6 }

          - type: markdown
            title: Jo
            # No example subview for this one. Copy person-mia, rename it person-jo,
            # then make this a navigate to /wall-panel/person-jo.
            tap_action: { action: none }
            content: |-
              {%- set rows = state_attr('sensor.family_today','events') or [] -%}
              {%- set mine = rows | selectattr('who','eq','Jo') | list -%}
              {%- set ns = namespace(l=[]) -%}
              {%- for e in mine[:9] -%}
              {%- set ns.l = ns.l + ['**' ~ ('All day' if e.all_day else e.at) ~ '** ' ~ e.what] -%}
              {%- endfor -%}
              {%- if mine | count > 9 -%}{%- set ns.l = ns.l + ['*+' ~ (mine | count - 9) ~ ' more*'] -%}{%- endif -%}
              {%- if not ns.l -%}
              {%- set today = now().strftime('%Y-%m-%d') -%}
              {%- set d1 = (now() + timedelta(days=1)).strftime('%Y-%m-%d') -%}
              {%- set wk = (state_attr('sensor.family_week','events') or []) | selectattr('who','eq','Jo') | rejectattr('day','eq',today) | list -%}
              {%- if wk -%}
              {%- set e = wk[0] -%}
              {%- set ns.l = ['*Nothing on today*', '', '**Next** ' ~ ('Tomorrow' if e.day == d1 else as_local(as_datetime(e.day)).strftime('%A')) ~ ('' if e.all_day else ' ' ~ e.at), e.what] -%}
              {%- else -%}
              {%- set ns.l = ['*Nothing on this week*'] -%}
              {%- endif -%}
              {%- endif -%}
              {{ ns.l | join('<br>') }}
            card_mod:
              style: |
                ha-card {
                  overflow: hidden;
                  --ha-card-header-color: #9A72C8;
                  --ha-font-weight-normal: 600;
                }
                ha-markdown { font-size: 20px; line-height: 1.4; font-weight: 400; }
            grid_options: { columns: 12, rows: 6 }

      # ── The kids ─────────────────────────────────────────────────────
      # Three panels a column, 4 grid rows (248px) each.
      - type: grid
        cards:
          - type: markdown
            title: Rory
            # No example subview for this one. Copy person-mia, rename it person-rory,
            # then make this a navigate to /wall-panel/person-rory.
            tap_action: { action: none }
            content: |-
              {%- set rows = state_attr('sensor.family_today','events') or [] -%}
              {%- set mine = rows | selectattr('who','eq','Rory') | list -%}
              {%- set ns = namespace(l=[]) -%}
              {%- for e in mine[:5] -%}
              {%- set ns.l = ns.l + ['**' ~ ('All day' if e.all_day else e.at) ~ '** ' ~ e.what] -%}
              {%- endfor -%}
              {%- if mine | count > 5 -%}{%- set ns.l = ns.l + ['*+' ~ (mine | count - 5) ~ ' more*'] -%}{%- endif -%}
              {%- if not ns.l -%}
              {%- set today = now().strftime('%Y-%m-%d') -%}
              {%- set d1 = (now() + timedelta(days=1)).strftime('%Y-%m-%d') -%}
              {%- set wk = (state_attr('sensor.family_week','events') or []) | selectattr('who','eq','Rory') | rejectattr('day','eq',today) | list -%}
              {%- if wk -%}
              {%- set e = wk[0] -%}
              {%- set ns.l = ['*Nothing on today*', '', '**Next** ' ~ ('Tomorrow' if e.day == d1 else as_local(as_datetime(e.day)).strftime('%A')) ~ ('' if e.all_day else ' ' ~ e.at), e.what] -%}
              {%- else -%}
              {%- set ns.l = ['*Nothing on this week*'] -%}
              {%- endif -%}
              {%- endif -%}
              {{ ns.l | join('<br>') }}
            card_mod:
              style: |
                ha-card {
                  overflow: hidden;
                  --ha-card-header-color: #A3B0F2;
                  --ha-font-weight-normal: 600;
                }
                ha-markdown { font-size: 20px; line-height: 1.4; font-weight: 400; }
            grid_options: { columns: 12, rows: 4 }

          - type: markdown
            title: Mia
            tap_action: { action: navigate, navigation_path: /wall-panel/person-mia }
            content: |-
              {%- set rows = state_attr('sensor.family_today','events') or [] -%}
              {%- set mine = rows | selectattr('who','eq','Mia') | list -%}
              {%- set ns = namespace(l=[]) -%}
              {%- for e in mine[:5] -%}
              {%- set ns.l = ns.l + ['**' ~ ('All day' if e.all_day else e.at) ~ '** ' ~ e.what] -%}
              {%- endfor -%}
              {%- if mine | count > 5 -%}{%- set ns.l = ns.l + ['*+' ~ (mine | count - 5) ~ ' more*'] -%}{%- endif -%}
              {%- if not ns.l -%}
              {%- set today = now().strftime('%Y-%m-%d') -%}
              {%- set d1 = (now() + timedelta(days=1)).strftime('%Y-%m-%d') -%}
              {%- set wk = (state_attr('sensor.family_week','events') or []) | selectattr('who','eq','Mia') | rejectattr('day','eq',today) | list -%}
              {%- if wk -%}
              {%- set e = wk[0] -%}
              {%- set ns.l = ['*Nothing on today*', '', '**Next** ' ~ ('Tomorrow' if e.day == d1 else as_local(as_datetime(e.day)).strftime('%A')) ~ ('' if e.all_day else ' ' ~ e.at), e.what] -%}
              {%- else -%}
              {%- set ns.l = ['*Nothing on this week*'] -%}
              {%- endif -%}
              {%- endif -%}
              {{ ns.l | join('<br>') }}
            card_mod:
              style: |
                ha-card {
                  overflow: hidden;
                  --ha-card-header-color: #D4A8F5;
                  --ha-font-weight-normal: 600;
                }
                ha-markdown { font-size: 20px; line-height: 1.4; font-weight: 400; }
            grid_options: { columns: 12, rows: 4 }

          - type: markdown
            title: Ivy
            # No example subview for this one. Copy person-mia, rename it person-ivy,
            # then make this a navigate to /wall-panel/person-ivy.
            tap_action: { action: none }
            content: |-
              {%- set rows = state_attr('sensor.family_today','events') or [] -%}
              {%- set mine = rows | selectattr('who','eq','Ivy') | list -%}
              {%- set ns = namespace(l=[]) -%}
              {%- for e in mine[:5] -%}
              {%- set ns.l = ns.l + ['**' ~ ('All day' if e.all_day else e.at) ~ '** ' ~ e.what] -%}
              {%- endfor -%}
              {%- if mine | count > 5 -%}{%- set ns.l = ns.l + ['*+' ~ (mine | count - 5) ~ ' more*'] -%}{%- endif -%}
              {%- if not ns.l -%}
              {%- set today = now().strftime('%Y-%m-%d') -%}
              {%- set d1 = (now() + timedelta(days=1)).strftime('%Y-%m-%d') -%}
              {%- set wk = (state_attr('sensor.family_week','events') or []) | selectattr('who','eq','Ivy') | rejectattr('day','eq',today) | list -%}
              {%- if wk -%}
              {%- set e = wk[0] -%}
              {%- set ns.l = ['*Nothing on today*', '', '**Next** ' ~ ('Tomorrow' if e.day == d1 else as_local(as_datetime(e.day)).strftime('%A')) ~ ('' if e.all_day else ' ' ~ e.at), e.what] -%}
              {%- else -%}
              {%- set ns.l = ['*Nothing on this week*'] -%}
              {%- endif -%}
              {%- endif -%}
              {{ ns.l | join('<br>') }}
            card_mod:
              style: |
                ha-card {
                  overflow: hidden;
                  --ha-card-header-color: #9EE0B4;
                  --ha-font-weight-normal: 600;
                }
                ha-markdown { font-size: 20px; line-height: 1.4; font-weight: 400; }
            grid_options: { columns: 12, rows: 4 }

      # ── The house ────────────────────────────────────────────────────
      - type: grid
        cards:
          - type: markdown
            title: House
            # No example subview for this one. Copy person-mia, rename it person-house,
            # then make this a navigate to /wall-panel/person-house.
            tap_action: { action: none }
            content: |-
              {%- set rows = state_attr('sensor.family_today','events') or [] -%}
              {%- set mine = rows | selectattr('who','eq','House') | list -%}
              {%- set ns = namespace(l=[]) -%}
              {%- for e in mine[:5] -%}
              {%- set ns.l = ns.l + ['**' ~ ('All day' if e.all_day else e.at) ~ '** ' ~ e.what] -%}
              {%- endfor -%}
              {%- if mine | count > 5 -%}{%- set ns.l = ns.l + ['*+' ~ (mine | count - 5) ~ ' more*'] -%}{%- endif -%}
              {%- if not ns.l -%}
              {%- set today = now().strftime('%Y-%m-%d') -%}
              {%- set d1 = (now() + timedelta(days=1)).strftime('%Y-%m-%d') -%}
              {%- set wk = (state_attr('sensor.family_week','events') or []) | selectattr('who','eq','House') | rejectattr('day','eq',today) | list -%}
              {%- if wk -%}
              {%- set e = wk[0] -%}
              {%- set ns.l = ['*Nothing on today*', '', '**Next** ' ~ ('Tomorrow' if e.day == d1 else as_local(as_datetime(e.day)).strftime('%A')) ~ ('' if e.all_day else ' ' ~ e.at), e.what] -%}
              {%- else -%}
              {%- set ns.l = ['*Nothing on this week*'] -%}
              {%- endif -%}
