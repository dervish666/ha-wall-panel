            grid_options: { columns: 12, rows: 3 }

          - type: markdown
            title: Tomorrow
            tap_action: { action: navigate, navigation_path: /wall-panel/detail-tomorrow }
            content: |-
              {%- set rows = state_attr('sensor.family_week','events') or [] -%}
              {%- set d = (now() + timedelta(days=1)).strftime('%Y-%m-%d') -%}
              {%- set mine = rows | selectattr('day','eq',d) | list -%}
              {%- set ns = namespace(l=[]) -%}
              {%- for e in mine[:5] -%}
              {%- set ns.l = ns.l + ['**' ~ ('All day' if e.all_day else e.at) ~ '** ' ~ e.who ~ ' · ' ~ e.what] -%}
              {%- endfor -%}
              {%- if mine | count > 5 -%}{%- set ns.l = ns.l + ['*+' ~ (mine | count - 5) ~ ' more*'] -%}{%- endif -%}
              {{ ns.l | join('<br>') if ns.l else '*Nothing on*' }}
            card_mod:
              style: |
                ha-card {
                  overflow: hidden;
                  --ha-font-weight-normal: 600;
                }
                ha-markdown { font-size: 20px; line-height: 1.4; font-weight: 400; }
            grid_options: { columns: 12, rows: 4 }

          # Kit reminders first (they are about tonight), then the next few
          # school dates from family-extra.json, then its flags, then anything
          # it could not check. Five entries fit the panel even when they wrap.
          # Kit comes from family-extra.json items with kind "kit"; if you have
          # a timetable sensor that knows PE days, this is where it goes.
          - type: markdown
            title: School
            tap_action: { action: navigate, navigation_path: /wall-panel/detail-school }
            content: |-
              {%- set ex = state_attr('sensor.family_extra','items') or [] -%}
              {%- set today = now().strftime('%Y-%m-%d') -%}
              {%- set soon = ex | selectattr('date','ge',today) | list -%}
              {%- set flags = state_attr('sensor.family_extra','flags') or [] -%}
              {%- set gone = (state_attr('sensor.family_extra','sources') or {}).get('unavailable') or [] -%}
              {%- set ns = namespace(l=[]) -%}
              {%- set d1 = (now() + timedelta(days=1)).strftime('%Y-%m-%d') -%}
              {%- for k in ex | selectattr('kind','eq','kit') | selectattr('date','eq',d1) -%}
              {%- set ns.l = ns.l + ['**' ~ k.what ~ ' tomorrow** · ' ~ k.who] -%}
              {%- endfor -%}
              {%- for k in ex | selectattr('kind','eq','kit') | selectattr('date','eq',today) -%}
              {%- set ns.l = ns.l + ['**' ~ k.what ~ ' today** · ' ~ k.who] -%}
              {%- endfor -%}
              {%- set soon = soon | rejectattr('kind','eq','kit') | list -%}
              {%- for i in soon[:3] -%}
              {%- set ns.l = ns.l + ['**' ~ as_local(as_datetime(i.date)).strftime('%a %-d %b') ~ '** ' ~ i.who ~ ' · ' ~ i.what] -%}
              {%- endfor -%}
              {#- THE CAP ONLY EVER APPLIES TO ITEMS. Everything below it is a
                  warning, and a warning a cap can truncate is worse than none:
                  the card looks calmest exactly when it has most to hide. That
                  is not hypothetical: "Could not check pdf-attachments,
                  second-mailbox, school-email" was the sixth line of five and
                  was being silently dropped, on the one card whose whole job is
                  to say what it could not see. -#}
              {#- Budget RENDERED lines, not list entries. This column is ~272px
                  wide, so "Mon 21 Sep Mia · New maths homework due. Last one was not
                  started." is three lines on the panel, not one. Counting entries
                  produced a card that clipped both warnings below the fold while
                  the arithmetic said it fitted, caught only by a screenshot.
                  ~26 visible characters a line at 18px; markdown and entities do
                  not render, so strip them before measuring.
                  Warnings are load-bearing and always included; items take what is
                  left. A namespace throughout, because `set` inside a for loop does
                  not survive the loop in Jinja. -#}
              {%- set CPL = 26 -%}
              {%- macro plain(t) -%}{{ t | replace('**','') | replace('*','') | replace('&nbsp;',' ') | replace('&middot;','·') | replace('&mdash;','—') }}{%- endmacro -%}
              {%- set w = namespace(l=[], h=0) -%}
              {%- for f in flags -%}{%- set w.l = w.l + ['⚠ ' ~ f] -%}{%- endfor -%}
              {%- if gone -%}{%- set w.l = w.l + ['*Unchecked: ' ~ (gone | map('replace','-attachments','s') | map('replace','-',' ') | join(', ')) ~ '*'] -%}{%- endif -%}
              {#- sensor.family_extra is a command_line sensor re-reading the JSON
                  every 300s, so the SENSOR always looks alive while the DATA ages.
                  Nothing writes that file but whatever gather job you run yourself. -#}
              {%- set ts = state_attr('sensor.family_extra','checked_at') -%}
              {%- set age = ((now() - as_datetime(ts)).total_seconds() / 86400) | round(0) | int if ts else none -%}
              {%- if age is none -%}{%- set w.l = w.l + ['⚠ *Never gathered*'] -%}
              {%- elif age >= 7 -%}{%- set w.l = w.l + ['⚠ *' ~ age ~ ' days since a gather*'] -%}
              {%- elif age >= 3 -%}{%- set w.l = w.l + ['*Gathered ' ~ age ~ 'd ago*'] -%}
              {%- endif -%}
              {%- for x in w.l -%}{%- set w.h = w.h + ([1, (plain(x) | trim | length / CPL) | round(0, 'ceil') | int] | max) -%}{%- endfor -%}
              {%- set b = namespace(l=[], h=w.h) -%}
              {%- for x in ns.l -%}
              {%- set cost = [1, (plain(x) | trim | length / CPL) | round(0, 'ceil') | int] | max -%}
              {%- if b.h + cost <= 10 -%}{%- set b.l = b.l + [x] -%}{%- set b.h = b.h + cost -%}{%- endif -%}
              {%- endfor -%}
              {%- if ns.l | count > b.l | count -%}{%- set b.l = b.l + ['*+' ~ (ns.l | count - b.l | count) ~ ' more*'] -%}{%- endif -%}
              {{ (b.l + w.l) | join('<br>') if (b.l + w.l) else '*Nothing booked*' }}
            card_mod:
              style: |
                ha-card {
                  overflow: hidden;
                  --ha-font-weight-normal: 600;
                }
                ha-markdown { font-size: 18px; line-height: 1.33; font-weight: 400; }
            grid_options: { columns: 12, rows: 5 }

